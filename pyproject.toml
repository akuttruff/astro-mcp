[project]
name = "astro-mcp"
version = "0.1.0"
description = "MCP server exposing immanuel-python astrology calculations to local LLMs"
requires-python = ">=3.10"
dependencies = [
    "immanuel>=1.6.0,<2.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "geopy>=2.4",  # Optional: for city/state/country to coordinates conversion
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
astro-mcp = "astro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
